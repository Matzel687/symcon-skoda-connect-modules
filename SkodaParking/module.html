<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skoda Parking</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 10px;
            background: transparent;
            color: #e2e8f0;
            font-size: 12px;
        }
        .card {
            background: rgba(15, 23, 42, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 8px;
            padding: 10px;
        }
        .title {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.2);
        }
        .label { color: #cbd5e1; }
        .value { color: #f8fafc; font-weight: 600; text-align: right; word-break: break-word; }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">Skoda Parking</div>
        <div class="row"><span class="label">Status:</span><span class="value" id="state">-</span></div>
        <div class="row"><span class="label">Adresse:</span><span class="value" id="address">-</span></div>
        <div class="row"><span class="label">Lat:</span><span class="value" id="latitude">-</span></div>
        <div class="row"><span class="label">Lon:</span><span class="value" id="longitude">-</span></div>
        <div class="row"><span class="label">Zeitpunkt:</span><span class="value" id="timestamp">-</span></div>
    </div>

    <script>
        function handleMessage(message) {
            const parking = message && message.parkingPosition ? message.parkingPosition : message;
            const overall = parking && parking.overall ? parking.overall : parking;
            document.getElementById('state').innerText = overall && overall.state ? overall.state : '-';
            document.getElementById('address').innerText = overall && overall.formattedAddress ? overall.formattedAddress : '-';
            const gps = overall && overall.gpsCoordinates ? overall.gpsCoordinates : (parking && parking.gpsCoordinates ? parking.gpsCoordinates : {});
            document.getElementById('latitude').innerText = gps && gps.latitude !== undefined ? gps.latitude : '-';
            document.getElementById('longitude').innerText = gps && gps.longitude !== undefined ? gps.longitude : '-';
            document.getElementById('timestamp').innerText = parking && parking.carCapturedTimestamp ? parking.carCapturedTimestamp : '-';
        }
    </script>
</body>
</html>
